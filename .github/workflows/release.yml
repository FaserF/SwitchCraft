name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    uses: FaserF/repo-template/.github/workflows/reusable-release.yml@v1
    with:
      tag_name: ${{ github.event_name == 'push' && github.ref_name || '' }}
      release_type: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || '' }}
      draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
    secrets: inherit
